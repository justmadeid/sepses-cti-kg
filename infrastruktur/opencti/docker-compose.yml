name: opencti

services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      thread_pool.search.queue_size: 5000
      ES_JAVA_OPTS: "-Xms${ELASTIC_MEMORY_SIZE:-2g} -Xmx${ELASTIC_MEMORY_SIZE:-2g}"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 50

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  opencti:
    image: opencti/platform:${OPENCTI_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      APP__PORT: 8080
      APP__BASE_URL: http://${OPENCTI_HOST:-localhost}:${OPENCTI_PORT:-8080}
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN}
      APP__ENCRYPTION_KEY: ${OPENCTI_ENCRYPTION_KEY}
      APP__HEALTH_ACCESS_KEY: ${OPENCTI_HEALTHCHECK_ACCESS_KEY}
      REDIS__HOSTNAME: redis
      REDIS__PORT: 6379
      ELASTICSEARCH__URL: http://elasticsearch:9200
      ELASTICSEARCH__NUMBER_OF_REPLICAS: 0
      MINIO__ENDPOINT: minio
      MINIO__PORT: 9000
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__PORT_MANAGEMENT: 15672
      RABBITMQ__MANAGEMENT_SSL: "false"
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy
    ports:
      - "${OPENCTI_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    image: opencti/worker:${OPENCTI_VERSION:-latest}
    restart: unless-stopped
    deploy:
      replicas: 4
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      WORKER_LOG_LEVEL: info
    depends_on:
      opencti:
        condition: service_healthy

  connector-import-file-stix:
    image: opencti/connector-import-file-stix:${OPENCTI_VERSION:-latest}
    # Image connector dijalankan melalui emulasi pada Apple Silicon bila
    # registry tidak menyediakan manifest arm64.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${IMPORT_FILE_STIX_CONNECTOR_ID}
      CONNECTOR_TYPE: INTERNAL_IMPORT_FILE
      CONNECTOR_NAME: ImportFileStix
      CONNECTOR_SCOPE: application/json,text/xml
      CONNECTOR_VALIDATE_BEFORE_IMPORT: "false"
      CONNECTOR_AUTO: "false"
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
    depends_on:
      opencti:
        condition: service_healthy

  connector-export-file-stix:
    image: opencti/connector-export-file-stix:${OPENCTI_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${EXPORT_FILE_STIX_CONNECTOR_ID}
      CONNECTOR_TYPE: INTERNAL_EXPORT_FILE
      CONNECTOR_NAME: Export STIX 2.1
      CONNECTOR_SCOPE: application/json
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
    depends_on:
      opencti:
        condition: service_healthy

  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:${OPENCTI_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_NAME: CISA Known Exploited Vulnerabilities
      CONNECTOR_SCOPE: cisa
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
      CONNECTOR_DURATION_PERIOD: ${CISA_KEV_DURATION_PERIOD:-P2D}
      CISA_CATALOG_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      CISA_CREATE_INFRASTRUCTURES: "false"
      CISA_KEV_FLAG_ONLY: "false"
      CISA_TLP: TLP:CLEAR
    depends_on:
      opencti:
        condition: service_healthy

  connector-cve-nvd:
    image: opencti/connector-cve:${OPENCTI_VERSION:-latest}
    platform: linux/amd64
    profiles: ["nvd"]
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CVE_NVD_CONNECTOR_ID}
      CONNECTOR_NAME: NIST NVD CVE
      CONNECTOR_SCOPE: cve
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
      CVE_API_KEY: ${NVD_API_KEY:-}
      CVE_INTERVAL: ${CVE_NVD_INTERVAL_HOURS:-6}
      CVE_MAX_DATE_RANGE: ${CVE_NVD_MAX_DATE_RANGE_DAYS:-1}
      CVE_MAINTAIN_DATA: "true"
      CVE_PULL_HISTORY: "false"
      CVE_IMPORT_SOFTWARE: "false"
      CVE_CVE_MAX_CONCURRENCY: 1
    depends_on:
      opencti:
        condition: service_healthy

  connector-opencti-datasets:
    image: opencti/connector-opencti:${OPENCTI_VERSION:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${OPENCTI_DATASETS_CONNECTOR_ID}
      CONNECTOR_NAME: OpenCTI Datasets
      CONNECTOR_SCOPE: marking-definition,identity,location
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
      CONNECTOR_DURATION_PERIOD: PT1H
      CONFIG_SECTORS_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/sectors.json
      CONFIG_GEOGRAPHY_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/geography.json
      CONFIG_COMPANIES_FILE_URL: https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/companies.json
      CONFIG_REMOVE_CREATOR: "false"
      CONFIG_INTERVAL: ${OPENCTI_DATASETS_INTERVAL_DAYS:-7}
    depends_on:
      opencti:
        condition: service_healthy

  connector-alienvault:
    image: opencti/connector-alienvault:${OPENCTI_VERSION:-latest}
    # Image resmi connector belum menyediakan build arm64; Docker Desktop
    # menjalankannya melalui emulasi Rosetta/QEMU pada Apple Silicon.
    platform: linux/amd64
    profiles: ["alienvault"]
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${ALIENVAULT_CONNECTOR_ID}
      CONNECTOR_NAME: AlienVault OTX
      CONNECTOR_SCOPE: alienvault
      CONNECTOR_LOG_LEVEL: ${CONNECTOR_LOG_LEVEL:-info}
      CONNECTOR_DURATION_PERIOD: ${ALIENVAULT_DURATION_PERIOD:-PT30M}
      ALIENVAULT_BASE_URL: https://otx.alienvault.com
      ALIENVAULT_API_KEY: ${ALIENVAULT_API_KEY}
      ALIENVAULT_TLP: ${ALIENVAULT_TLP:-White}
      ALIENVAULT_CREATE_OBSERVABLES: "true"
      ALIENVAULT_CREATE_INDICATORS: "true"
      ALIENVAULT_PULSE_START_TIMESTAMP: ${ALIENVAULT_PULSE_START_TIMESTAMP}
      ALIENVAULT_REPORT_TYPE: threat-report
      ALIENVAULT_REPORT_STATUS: New
      ALIENVAULT_GUESS_MALWARE: "false"
      ALIENVAULT_GUESS_CVE: "false"
      ALIENVAULT_ENABLE_RELATIONSHIPS: "true"
      ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES: "true"
      ALIENVAULT_FILTER_INDICATORS: "false"
      ALIENVAULT_DEFAULT_X_OPENCTI_SCORE: 50
    depends_on:
      opencti:
        condition: service_healthy

volumes:
  redis-data:
  elasticsearch-data:
  minio-data:
  rabbitmq-data:
